<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161616">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planos">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>Planos</title>
<style>
:root{--azul:#0B1F3A;--acento:#1E88E5;--gris:#5F6B7A;--claro:#EEF2F7;--borde:#D6DEE8;--rojo:#C62828;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--azul);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:var(--azul);color:#fff;padding:calc(var(--st) + 6px) 8px 6px;display:flex;align-items:center;gap:4px}
header .tit{flex:1;min-width:0;padding:0 4px}
header .tit b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tit small{display:block;font-size:11px;opacity:.7;letter-spacing:.08em}
a.ib{color:#fff;text-decoration:none}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px}
.ib:active{background:rgba(255,255,255,.15)}
.ib[disabled]{opacity:.35}
#tabs{display:flex;gap:6px;padding:6px 8px;overflow-x:auto;background:var(--claro);border-bottom:1px solid var(--borde);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;padding:6px 12px;border-radius:16px;background:#fff;border:1px solid var(--borde);font-size:13px;font-weight:600}
#tabs button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
#lienzo{flex:1;position:relative;overflow:hidden;background:#fff}
#plano{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#aviso{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(11,31,58,.88);color:#fff;font-size:13px;padding:6px 12px;border-radius:14px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;display:none}
#zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--borde);box-shadow:0 1px 4px rgba(0,0,0,.08);font-size:18px;font-weight:700}
#panel{background:#fff;border-top:1px solid var(--borde);padding:8px;display:none;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
#panel.on{display:flex}
#panel .nom{font-weight:700;margin-right:auto;font-size:14px}
.pb{padding:8px 11px;border-radius:9px;background:var(--claro);font-weight:600;font-size:13px;white-space:nowrap}
.pb.rojo{background:#FDECEC;color:var(--rojo)}
.pb.az{background:var(--azul);color:#fff}
#panel input{width:70px;padding:7px;border:1px solid var(--borde);border-radius:8px;font:inherit;font-size:16px}
.circ{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--borde)}
.circ.on{box-shadow:0 0 0 2px var(--azul)}
nav{display:flex;background:var(--azul);padding:4px 2px calc(var(--sb) + 4px);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:56px;color:#B8C7DA;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;border-radius:10px;font-size:10.5px;font-weight:600}
nav button span{font-size:20px;line-height:22px}
nav button.on{color:#fff;background:rgba(255,255,255,.14)}
.velo{position:fixed;inset:0;background:rgba(11,31,58,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.velo.on{display:flex}
.hoja{background:#fff;width:100%;max-width:640px;max-height:84vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(var(--sb) + 18px)}
.hoja h2{margin:2px 0 10px;font-size:18px;display:flex;align-items:center}
.hoja h2 .x{margin-left:auto;font-size:22px;width:36px;height:36px}
.hoja h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:14px 0 6px}
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.rej button{border:1px solid var(--borde);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1.15;text-align:center}
.rej button:active{background:var(--claro)}
.rej svg{width:52px;height:40px}
.fila{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--claro)}
.fila .q{flex:1;min-width:0}
.fila .q b{display:block}
.fila .q small{color:var(--gris)}
.fila.on b{color:var(--acento)}
.lista{width:100%;border-collapse:collapse;font-size:14px}
.lista td{padding:6px 2px;border-bottom:1px solid var(--claro)}
.lista td:last-child{text-align:right;font-weight:700}
.big{display:block;width:100%;padding:13px;border-radius:12px;background:var(--claro);font-weight:700;margin-top:8px;text-align:left;font-size:15px}
.big.az{background:var(--azul);color:#fff}
.big small{display:block;font-weight:500;opacity:.75;font-size:12px}
#print{display:none}
#vDlg{z-index:20}
.modo{display:inline-flex;background:rgba(255,255,255,.12);border-radius:9px;padding:2px;margin-bottom:3px}
.modo button{color:#B8C7DA;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px}
.modo button.on{background:#fff;color:var(--azul)}
#app.mpres #tabs,#app.mpres #lienzo,#app.mpres #panel,#app.mpres nav,#app.mpres #bUndo,#app.mpres #bRedo,#app.mpres #bExp,#app.mpres #b3d,#app.mpres #bProy{display:none}
#b3d{font-size:13px;font-weight:900;letter-spacing:.02em;width:auto;padding:0 9px;border:1.5px solid currentColor;height:30px;border-radius:8px;margin:0 2px}
.v3d{position:fixed;inset:0;z-index:60;background:#F4F2EC;display:flex;flex-direction:column}
.v3d-cab{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 10px 16px;background:#161616;color:#fff;font-size:16px}
.v3d-cab b{flex:1}.v3d-x{background:none;border:0;color:#fff;font-size:28px;width:44px;height:44px;cursor:pointer}
.v3d canvas{flex:1;min-height:0;width:100%;touch-action:none;display:block}
.v3d-ayuda{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;font-size:12.5px;color:#5C5A55;pointer-events:none}
.v3d-vacio{position:absolute;inset:40% 20px auto;text-align:center;font-weight:700;color:#5C5A55}
.v3d-bar{display:flex;gap:6px;overflow-x:auto;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:#fff;border-top:1px solid #DCD9D0;scrollbar-width:none;align-items:center}
.v3d-bar>button,.v3d-alto button{flex:none;border:1px solid #DCD9D0;background:#fff;border-radius:16px;padding:8px 12px;font:inherit;font-size:13.5px;font-weight:700;color:#161616;cursor:pointer}
.v3d-bar>button.on{background:#161616;color:#FFD400;border-color:#161616}
.v3d-alto{flex:none;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding-left:4px}.v3d-alto button{padding:6px 11px}
#pres{display:none;flex:1;overflow:auto;background:#F3F6FA;-webkit-overflow-scrolling:touch;position:relative}
#app.mpres #pres{display:block}
.pcont{padding:12px 12px calc(var(--sb) + 20px);max-width:680px;margin:0 auto}
.pcont h3 .mas{margin-left:auto;color:var(--acento);font-size:13px;letter-spacing:0;text-transform:none;font-weight:700}
.pcont h3{display:flex;align-items:center}
.pcont h3,.hoja h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:16px 0 6px}
.tarjeta{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tarjeta.ok{background:#E3F2FD}
.tarjeta .imp{white-space:nowrap;font-size:14px;text-align:right}
.tarjeta .imp small{display:block;font-weight:500;color:var(--gris);font-size:10px}
.vacio{color:var(--gris);font-size:14px;text-align:center;padding:14px}
.caja{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:10px 12px}
.caja label,.hoja label{display:block;font-size:12px;color:var(--gris);font-weight:600;margin:6px 0}
.caja input,.caja textarea,.hoja input:not([type=radio]):not([type=checkbox]){display:block;width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--borde);border-radius:9px;font:inherit;font-size:16px;color:var(--azul);background:#fff}
.caja textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bots{margin-top:10px}.bots .pb{width:100%;padding:11px 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.seg button{border:1px solid var(--borde);border-radius:10px;padding:8px;font-weight:700;font-size:14px;background:#fff}
.seg button small{display:block;font-weight:500;font-size:11px;color:var(--gris)}
.seg button.on{background:var(--azul);color:#fff;border-color:var(--azul)}.seg button.on small{color:#B8C7DA}
.volver{font-weight:700;color:var(--acento);font-size:15px;padding:4px 0 10px}
.part{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:9px 10px;margin-bottom:7px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.part .pc{grid-column:1/3;cursor:pointer}.part .pc b{display:block;font-size:14px}.part .pc small{color:var(--gris);font-size:12px}
.pq{display:flex;align-items:center;gap:4px}.pq button{width:34px;height:32px;border-radius:8px;background:var(--claro);font-size:18px;font-weight:700}
.pq span{min-width:38px;text-align:center;font-weight:700}
.pi{text-align:right}.pi small{display:block;color:var(--gris);font-size:11px}.pi b{font-size:15px}
.barraTotal{position:sticky;bottom:0;background:var(--azul);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px calc(var(--sb) + 10px)}
.barraTotal div{flex:1}.barraTotal small{display:block;font-size:11px;color:#B8C7DA}.barraTotal b{font-size:17px}
.barraTotal .pb{background:#fff;color:var(--azul);padding:11px 20px;font-size:15px}
.ayuda{display:block;color:var(--gris);font-size:11.5px;margin-top:6px;line-height:1.35}
.chk{display:flex!important;gap:8px;align-items:center;font-size:13px!important;margin-top:10px!important}
.trow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--claro);font-size:12.5px}
.trow span{flex:1}.trow input{width:86px!important;flex:none;margin:0!important;padding:6px!important;font-size:15px!important}
#firmaCv{width:100%;height:auto;border:1px dashed var(--borde);border-radius:10px;touch-action:none;background:#fff}
#impLista .tarjeta{display:flex;align-items:center;gap:10px}
.big.ia{background:linear-gradient(135deg,#1E88E5,#7B3FA0);color:#fff;border:0}.big.ia small{color:#E6DDF5}
.iaFotos{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.iaFotos .ft{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--borde)}
.iaFotos .ft img{width:100%;height:100%;object-fit:cover}
.iaFotos .ft button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.iaFotos .add{width:76px;height:76px;border-radius:10px;border:1.5px dashed var(--borde);font-size:26px;color:var(--acento);background:#fff}
#iaTxt{display:block;width:100%;min-height:130px;padding:10px;border:1px solid var(--borde);border-radius:10px;font:inherit;font-size:16px;color:var(--azul);resize:vertical}
.iaMic{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--gris)}
.iaMic button{border-radius:20px;padding:8px 14px;font-weight:700;background:var(--claro);color:var(--azul)}
.iaMic button.on{background:#C62828;color:#fff}
.part .rev{display:inline-block;margin-top:3px;font-size:11px;font-weight:700;color:#B25E00;background:#FFF3E0;border-radius:6px;padding:1px 6px}
@media print{
  @page{size:A4 landscape;margin:8mm}
  #app,.velo{display:none!important}
  html,body{height:auto;overflow:visible}
  #print{display:block}
  #print svg{width:100%;height:auto;max-height:190mm;page-break-after:always;break-after:page}
}
</style>
<link rel="stylesheet" href="/tema.css">
<script src="/iconos.js" defer></script>
</head>
<body>
<div id="app">
  <header>
    <a class="ib" href="/" title="Inicio">⌂</a>
    <button class="ib" id="bProy" title="Proyectos">☰</button>
    <div class="tit"><div class="modo"><button data-m="planos" class="on">Planos</button><button data-m="pres">Presupuestos</button></div><span id="nubeEst" style="font-size:13px;margin-left:6px;color:#8FA3BC" title="">☁︎</span><b id="nomProy">—</b></div>
    <button class="ib" id="bUndo" title="Deshacer">↶</button>
    <button class="ib" id="bRedo" title="Rehacer">↷</button>
    <button class="ib" id="b3d" title="Ver en 3D" aria-label="Ver el plano en 3D">3D</button>
    <button class="ib" id="bExp" title="Exportar">⇪</button>
  </header>
  <div id="tabs"></div>
  <div id="lienzo">
    <svg id="plano" xmlns="http://www.w3.org/2000/svg"><g id="vista"><g id="capaR"></g><g id="capaF"></g><g id="capa"></g></g></svg>
    <div id="aviso"></div>
    <div id="zoom"><button id="zMas">+</button><button id="zMenos">−</button><button id="zAjustar" style="font-size:14px">⤢</button></div>
  </div>
  <div id="panel"></div>
  <div id="pres"></div>
  <nav id="herr">
    <button data-h="sel" class="on"><span>✋</span>Mover</button>
    <button data-h="pared"><span>▬</span>Pared</button>
    <button data-h="hab"><span>▢</span>Habitación</button>
    <button data-h="simb"><span>⊕</span>Símbolos</button>
    <button data-h="cable"><span>〰</span>Cable</button>
    <button data-h="texto"><span>T</span>Texto</button>
    <button data-h="resumen"><span>Σ</span>Resumen</button>
  </nav>
</div>

<div class="velo" id="vSimb"><div class="hoja"><h2>Añadir símbolo <button class="x" data-cerrar>×</button></h2><div id="paleta"></div></div></div>
<div class="velo" id="vProy"><div class="hoja"><h2>Proyectos <button class="x" data-cerrar>×</button></h2><div id="listaProy"></div>
  <button class="big az" id="bNuevo">＋ Nuevo plano desde cero</button></div></div>
<div class="velo" id="vRes"><div class="hoja"><h2>Resumen y mediciones <button class="x" data-cerrar>×</button></h2><div id="resumen"></div>
  <button class="big az" id="bCopiar">Copiar resumen<small>Para pegarlo en WhatsApp o pasármelo para el presupuesto</small></button></div></div>
<div class="velo" id="vExp"><div class="hoja"><h2>Exportar y compartir <button class="x" data-cerrar>×</button></h2>
  <button class="big az" id="ePng">Imagen de esta planta (PNG)<small>Con la cabecera de tu empresa y leyenda con cantidades</small></button>
  <button class="big" id="ePngTodas">Imágenes de todas las plantas</button>
  <button class="big" id="ePdf">PDF / Imprimir<small>Una planta por página, A4 horizontal (elige «Guardar como PDF»)</small></button>
  <h3>Copia de seguridad</h3>
  <button class="big" id="eJson">Guardar copia del proyecto (.json)</button>
  <button class="big" id="eImp">Abrir copia (.json)</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
</div></div>
<div class="velo" id="vDlg" style="align-items:center;padding:16px"><div class="hoja" style="border-radius:16px;max-width:420px;padding:18px">
  <div id="dMsg" style="font-weight:700;font-size:16px;margin-bottom:12px;white-space:pre-line"></div>
  <input id="dIn" style="width:100%;padding:11px;border:1px solid var(--borde);border-radius:10px;font:inherit;font-size:16px" autocomplete="off">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="pb" id="dNo">Cancelar</button><button class="pb az" id="dOk">Aceptar</button></div>
</div></div>
<div class="velo" id="vPart"><div class="hoja"><h2>Partida <button class="x" data-cerrar>×</button></h2><div id="partForm"></div>
  <div class="g2 bots"><button class="pb rojo" id="pfDel">Eliminar</button><button class="pb az" id="pfOk">Guardar</button></div></div></div>
<div class="velo" id="vTar"><div class="hoja"><h2>Tu tarifa <button class="x" data-cerrar>×</button></h2>
  <input id="tarBus" placeholder="Buscar (enchufe, cámara, cable…)" autocomplete="off"><div id="tarLista"></div>
  <button class="big az" data-cerrar>Listo</button></div></div>
<div class="velo" id="vImp"><div class="hoja"><h2>Cargar desde un plano <button class="x" data-cerrar>×</button></h2>
  <div id="impLista"></div><h3>Cómo está la obra</h3>
  <label class="chk"><input type="checkbox" id="impTubo"> Tubos y cajas ya puestos (solo pasar cable)</label>
  <label class="chk"><input type="checkbox" id="impEmp"> Empotrado: añadir roza y tapado</label>
  <label class="chk"><input type="checkbox" id="impMat" checked> Incluir material (Asfora, cable, tubo y cajas)</label>
  <button class="big az" id="impOk">Añadir al presupuesto</button></div></div>
<div class="velo" id="vFondo"><div class="hoja"><h2>Plano de fondo <button class="x" data-cerrar>×</button></h2><div id="fondoForm"></div></div></div>
<div class="velo" id="vCli"><div class="hoja"><h2>Mis clientes <button class="x" data-cerrar>×</button></h2><input id="cliBus" placeholder="Buscar cliente" autocomplete="off"><div id="cliLista"></div></div></div>
<div class="velo" id="vIA"><div class="hoja"><h2>Presupuesto con IA <button class="x" data-cerrar>×</button></h2>
  <h3>1 · Fotos de la obra (opcional)</h3><div class="iaFotos" id="iaFotos"></div>
  <input type="file" id="iaFile" accept="image/*" multiple hidden>
  <h3>2 · Cuenta el trabajo</h3>
  <textarea id="iaTxt" placeholder="Ej.: Nave de 600 m². Poner 6 cámaras exteriores con grabador y la app en el móvil del cliente. Cableado por bandeja, unos 40 metros por cámara."></textarea>
  <div class="iaMic" id="iaMic"></div>
  <button class="big ia" id="iaOk" style="margin-top:14px">✨ Crear presupuesto<small>Usa tu tarifa. Lo que no esté en ella sale marcado para que revises el precio</small></button>
  <div id="iaEstado" style="font-size:14px;margin-top:8px;color:var(--gris);text-align:center"></div>
</div></div>
<div class="velo" id="vAj"><div class="hoja"><h2>Empresa, firma y tarifas <button class="x" data-cerrar>×</button></h2><div id="ajForm"></div></div></div>
<div id="print"></div>

<script src="/comun.js"></script>

<script>
"use strict";
if(!Nube.requerir())throw new Error("Hay que iniciar sesión");
const NS="http://www.w3.org/2000/svg", LS="almara-planos-v1";
const C={azul:"#0B1F3A",acento:"#1E88E5",gris:"#5F6B7A",nar:"#E8730C",verde:"#2E9D5B",rojo:"#C62828",morado:"#7B3FA0",teal:"#00838F",amar:"#C99A00"};
const CIRC=[
  {id:"c1",n:"C1 Alumbrado",c:C.nar},{id:"c2",n:"C2 Enchufes",c:C.acento},{id:"c3",n:"C3 Cocina/horno",c:C.rojo},
  {id:"c4",n:"C4 Lavadora/lavav./termo",c:C.morado},{id:"c5",n:"C5 Baño/cocina",c:C.teal},{id:"c6",n:"Aire acondicionado",c:C.verde},
  {id:"c7",n:"Datos / TV",c:C.amar},{id:"c0",n:"Otro",c:C.gris}];
// Tipos de símbolo. g = grupo de la paleta; box = rótulo con texto; w = ancho (m) para puertas y ventanas
const T={

function dialogo(msg,valor,conInput,conCancelar){return new Promise(ok=>{
  const v=$("vDlg"),i=$("dIn");$("dMsg").textContent=msg;i.style.display=conInput?"block":"none";i.value=valor||"";$("dNo").style.display=conCancelar?"":"none";
  v.classList.add("on");if(conInput)setTimeout(()=>{i.focus();i.select()},60);
  const fin=r=>{v.classList.remove("on");$("dOk").onclick=$("dNo").onclick=i.onkeydown=null;ok(r)};
  $("dOk").onclick=()=>fin(conInput?i.value:true);$("dNo").onclick=()=>fin(conInput?null:false);
  i.onkeydown=e=>{if(e.key==="Enter")fin(i.value)}})}
const pedir=(m,v)=>dialogo(m,v,true,true), confirmar=m=>dialogo(m,"",false,true), avisar=m=>dialogo(m,"",false,false);

// ---------- Símbolos ----------
function simb(it){
  const t=it.t, d=T[t]||{}, sw=.028;
  const L=(x1,y1,x2,y2,c,w)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w||sw}" stroke-linecap="round"/>`;
  const Ci=(x,y,r,c,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f||"#fff"}" stroke="${c}" stroke-width="${sw}"/>`;
  const Tx=(x,y,s,txt,c,w)=>`<text x="${x}" y="${y}" font-size="${s}" fill="${c}" font-weight="${w||700}" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif">${esc(txt)}</text>`;
  const pins=(x,c)=>L(x-.045,-.06,x-.045,.06,c)+L(x+.045,-.06,x+.045,.06,c);
  const X=(r,c)=>{const k=r*.707;return L(-k,-k,k,k,c)+L(-k,k,k,-k,c)};
  const tick=(dir,c)=>{const a=dir*-.7854,ex=Math.cos(a)*.26*dir,ey=Math.sin(a)*.26*dir;return L(0,0,ex,ey,c)+L(ex,ey,ex+.07*Math.cos(a+1.57)*dir,ey+.07*Math.sin(a+1.57)*dir,c)};
  switch(t){
    case"enchufe":return Ci(0,0,.15,C.acento)+pins(0,C.acento);
    case"doble":return Ci(-.13,0,.14,C.acento)+pins(-.13,C.acento)+Ci(.13,0,.14,C.acento)+pins(.13,C.acento);
    case"estanco":return Ci(0,0,.15,C.teal,"#E3F4F5")+pins(0,C.teal)+Tx(0,.26,.1,"IP",C.teal);
    case"usb":return Ci(0,0,.15,C.acento)+pins(0,C.acento)+Tx(0,.26,.09,"USB",C.acento);
    case"encimera":return Ci(0,0,.15,C.teal)+pins(0,C.teal)+L(-.2,.2,.2,.2,C.teal);
    case"luz":return Ci(0,0,.16,C.nar)+X(.16,C.nar);
    case"luzc":return Ci(0,0,.16,C.morado)+X(.16,C.morado)+`<circle r=".21" fill="none" stroke="${C.morado}" stroke-width=".02"/>`;
    case"aplique":return Ci(0,0,.13,C.nar)+X(.13,C.nar)+L(-.18,.17,.18,.17,C.nar,.04);
    case"foco":return `<circle r=".13" fill="#fff" stroke="${C.nar}" stroke-width="${sw}"/><circle r=".06" fill="${C.nar}"/>`;
    case"led":return `<rect x="-.35" y="-.05" width=".7" height=".1" rx=".03" fill="#FFE7CF" stroke="${C.nar}" stroke-width="${sw}"/>`+Tx(0,.15,.08,"LED",C.nar);
    case"exterior":return Ci(0,0,.15,C.nar,"#FFF3E6")+X(.15,C.nar)+Tx(0,.27,.09,"EXT",C.nar);
    case"inter":return `<circle r=".05" fill="${C.verde}"/>`+tick(1,C.verde);
    case"conm":return `<circle r=".05" fill="${C.verde}"/>`+tick(1,C.verde)+tick(-1,C.verde);
    case"cruce":return `<circle r=".05" fill="${C.verde}"/>`+tick(1,C.verde)+tick(-1,C.verde)+`<circle r=".11" fill="none" stroke="${C.verde}" stroke-width=".02"/>`;
    case"puls":return Ci(0,0,.11,C.verde)+`<circle r=".045" fill="${C.verde}"/>`;
    case"pir":return Ci(0,0,.15,C.verde)+Tx(0,0,.085,"PIR",C.verde);
    case"persiana":return `<rect x="-.13" y="-.13" width=".26" height=".26" rx=".03" fill="#fff" stroke="${C.verde}" stroke-width="${sw}"/>`+Tx(0,-.045,.09,"▲",C.verde)+Tx(0,.05,.09,"▼",C.verde);
    case"timbre":return `<path d="M-.12 .08 Q-.12 -.14 0 -.14 Q.12 -.14 .12 .08 Z" fill="#fff" stroke="${C.verde}" stroke-width="${sw}"/>`+L(-.15,.08,.15,.08,C.verde)+`<circle cy=".12" r=".03" fill="${C.verde}"/>`;
    case"ap":return Ci(0,0,.17,C.amar,"#FFF8E1")+`<path d="M-.09 -.01 Q0 -.09 .09 -.01 M-.05 .03 Q0 -.01 .05 .03" fill="none" stroke="${C.amar}" stroke-width=".022" stroke-linecap="round"/><circle cy=".07" r=".02" fill="${C.amar}"/>`;
    case"starlink":return `<rect x="-.2" y="-.14" width=".4" height=".28" rx=".04" fill="#fff" stroke="${C.azul}" stroke-width="${sw}"/>`+L(0,.14,0,.26,C.azul)+Tx(0,0,.075,"STARLINK",C.azul);
    case"camara":return `<rect x="-.16" y="-.09" width=".24" height=".18" rx=".03" fill="#FDECEC" stroke="${C.rojo}" stroke-width="${sw}"/><path d="M.08 -.05 L.18 -.1 L.18 .1 L.08 .05 Z" fill="${C.rojo}"/>`;
    case"puerta":{const w=it.w||d.w,h=w/2;return `<rect x="${-h}" y="-.075" width="${w}" height=".15" fill="#fff"/>`+L(-h,0,-h,-w,C.azul,.025)+`<path d="M${-h} ${-w} A${w} ${w} 0 0 1 ${h} 0" fill="none" stroke="${C.gris}" stroke-width=".015" stroke-dasharray=".05 .04"/>`+L(-h,-.07,-h,.07,C.azul,.03)+L(h,-.07,h,.07,C.azul,.03)}
    case"corredera":{const w=it.w||d.w,h=w/2;return `<rect x="${-h}" y="-.075" width="${w}" height=".15" fill="#fff"/>`+`<rect x="${-h}" y="-.03" width="${w*.6}" height=".04" fill="#fff" stroke="${C.azul}" stroke-width=".02"/>`+`<rect x="${-h+w*.35}" y="-.01" width="${w*.6}" height=".04" fill="#fff" stroke="${C.gris}" stroke-width=".02" stroke-dasharray=".04 .03"/>`}
    case"ventana":{const w=it.w||d.w,h=w/2;return `<rect x="${-h}" y="-.07" width="${w}" height=".14" fill="#fff" stroke="${C.azul}" stroke-width=".02"/>`+L(-h,0,h,0,C.acento,.02)}
    case"escalera":{const w=it.w||d.w,n=8,lng=2.4;let s=`<rect x="${-w/2}" y="${-lng/2}" width="${w}" height="${lng}" fill="#fff" stroke="${C.gris}" stroke-width=".02"/>`;for(let i=1;i<n;i++){const y=-lng/2+i*lng/n;s+=L(-w/2,y,w/2,y,C.gris,.015)}return s+L(0,lng/2-.1,0,-lng/2+.15,C.azul,.02)+`<path d="M-.07 ${-lng/2+.25} L0 ${-lng/2+.12} L.07 ${-lng/2+.25}" fill="none" stroke="${C.azul}" stroke-width=".02"/>`}
    case"texto":{const s=it.s||.28;return Tx(0,0,s,it.txt||"Texto",C.azul,700)+(it.sub?Tx(0,s*.95,s*.6,it.sub,C.gris,500):"")}
  }
  const ex=simbExtra(t,it,{L,Ci,Tx,pins,X,tick,sw,d});if(ex)return ex;
  if(d.box){const txt=it.txt||d.box,w=Math.max(d.w||0,.13+txt.length*.085);return `<rect x="${-w/2}" y="-.12" width="${w}" height=".24" rx=".04" fill="${d.fill?d.c:"#fff"}" stroke="${d.c}" stroke-width="${sw}"/>`+Tx(0,.005,.115,txt,d.fill?"#fff":d.c)}
  return Ci(0,0,.15,C.gris);
}
// Símbolos añadidos (catálogo ampliado)
function simbExtra(t,it,k){const {L,Ci,Tx,pins,X,tick,sw,d}=k;
  const R=(x,y,w,h,c,f,rx)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx??.03}" fill="${f||"#fff"}" stroke="${c}" stroke-width="${sw}"/>`;
  switch(t){
    case"triple":return [-.26,0,.26].map(x=>Ci(x,0,.13,C.acento)+pins(x,C.acento)).join("");
    case"suelo":return R(-.17,-.17,.34,.34,C.acento,"#E3F0FC")+Ci(0,0,.11,C.acento)+pins(0,C.acento);
    case"sai":return Ci(0,0,.15,C.rojo,"#FDECEC")+pins(0,C.rojo)+Tx(0,.26,.09,"SAI",C.rojo);
    case"t25":return Ci(0,0,.16,C.rojo)+pins(0,C.rojo)+L(0,.06,0,.12,C.rojo)+Tx(0,.28,.09,"25 A",C.rojo);
    case"tri":return Ci(0,0,.16,C.rojo)+L(-.06,-.06,-.06,.06,C.rojo)+L(.06,-.06,.06,.06,C.rojo)+L(0,-.09,0,.09,C.rojo)+Tx(0,.28,.09,"III",C.rojo);
    case"pantalla":return R(-.34,-.07,.68,.14,C.nar,"#FFF3E6",.02)+L(-.27,0,.27,0,C.nar);
    case"colgante":return L(0,-.24,0,-.14,C.nar)+Ci(0,0,.14,C.nar)+X(.14,C.nar);
    case"emerg":return R(-.2,-.1,.4,.2,C.verde,"#E3F4EA")+`<path d="M-.07 .05 L0 -.05 L.07 .05 Z" fill="${C.verde}"/>`;
    case"proyector":return `<path d="M-.16 -.12 L.16 -.16 L.16 .16 L-.16 .12 Z" fill="#FFF3E6" stroke="${C.nar}" stroke-width="${sw}"/>`+L(.2,-.1,.27,-.14,C.nar)+L(.2,0,.28,0,C.nar)+L(.2,.1,.27,.14,C.nar);
    case"baliza":return Ci(0,0,.1,C.nar,"#FFF3E6")+X(.1,C.nar)+L(0,.1,0,.24,C.nar)+L(-.08,.24,.08,.24,C.nar);
    case"inter2":return `<circle r=".05" fill="${C.verde}"/>`+tick(1,C.verde)+`<g transform="rotate(-25)">${tick(1,C.verde)}</g>`;
    case"regulador":return `<circle r=".05" fill="${C.verde}"/>`+tick(1,C.verde)+`<path d="M-.16 .16 L.16 .16 L.16 .04 Z" fill="${C.verde}" opacity=".7"/>`;
    case"interest":return `<circle r=".05" fill="${C.teal}"/>`+tick(1,C.teal)+Tx(0,.2,.09,"IP",C.teal);
    case"piloto":return `<circle r=".05" fill="${C.verde}"/>`+tick(1,C.verde)+`<circle r=".11" fill="none" stroke="${C.nar}" stroke-width=".02" stroke-dasharray=".03 .025"/>`;
    case"termostato":return R(-.14,-.14,.28,.28,C.verde)+Tx(0,0,.11,"T",C.verde,800);
    case"caja":return R(-.12,-.12,.24,.24,C.gris)+L(-.12,-.12,.12,.12,C.gris,.016)+L(-.12,.12,.12,-.12,C.gris,.016);
    case"tierra":return L(0,-.18,0,0,C.verde)+L(-.15,0,.15,0,C.verde)+L(-.1,.06,.1,.06,C.verde)+L(-.05,.12,.05,.12,C.verde);
    case"split":return R(-.34,-.1,.68,.2,C.verde,"#E3F4EA",.05)+L(-.26,.04,.26,.04,C.verde,.016)+Tx(0,-.02,.07,"A/A",C.verde);
    case"radiador":{let r=R(-.3,-.1,.6,.2,C.rojo,"#FDECEC",.02);for(let x=-.2;x<.25;x+=.1)r+=L(x,-.1,x,.1,C.rojo,.016);return r}
    case"placas":{let r=R(-.32,-.2,.64,.4,C.amar,"#FFF8E1",.01);for(const x of[-.107,.107])r+=L(x,-.2,x,.2,C.amar,.016);return r+L(-.32,0,.32,0,C.amar,.016)}
    case"antena":return L(0,.2,0,-.18,C.amar)+L(-.16,-.12,.16,-.12,C.amar)+L(-.12,-.04,.12,-.04,C.amar)+L(-.08,.04,.08,.04,C.amar);
    case"altavoz":return `<path d="M-.14 -.06 L-.05 -.06 L.06 -.15 L.06 .15 L-.05 .06 L-.14 .06 Z" fill="#FFF8E1" stroke="${C.amar}" stroke-width="${sw}" stroke-linejoin="round"/>`+`<path d="M.11 -.07 Q.17 0 .11 .07" fill="none" stroke="${C.amar}" stroke-width=".022"/>`;
    case"domo":return Ci(0,0,.16,C.rojo,"#FDECEC")+`<circle r=".07" fill="${C.rojo}"/><circle r=".025" fill="#fff"/>`;
    case"sirena":return `<path d="M-.16 .1 L-.16 -.02 Q-.16 -.16 0 -.16 Q.16 -.16 .16 -.02 L.16 .1 Z" fill="#FDECEC" stroke="${C.rojo}" stroke-width="${sw}"/>`+L(-.2,.1,.2,.1,C.rojo)+Tx(0,-.02,.08,"S",C.rojo,800);
    case"magnetico":return R(-.18,-.06,.16,.12,C.rojo,"#FDECEC",.01)+R(.02,-.06,.16,.12,C.rojo,"#FDECEC",.01);

function aMundo(cx,cy){const r=svg.getBoundingClientRect();return{x:(cx-r.left-cam.x)/cam.s,y:(cy-r.top-cam.y)/cam.s}}

function limites(pl){let a=1e9,b=1e9,c=-1e9,d=-1e9;

  for(const w of pl.paredes.concat(pl.cables)){add(w.x1,w.y1);add(w.x2,w.y2)}
  for(const it of pl.items){const e=Math.max(.35,(it.w||0)/2+.1,it.t==="escalera"?1.3:0);add(it.x-e,it.y-e);add(it.x+e,it.y+e)}
  if(pl.fondo){const q=cajaFondo(pl.fondo);add(q.x,q.y);add(q.x+q.w,q.y+q.h)}
  return a>c?null:{x:a,y:b,w:c-a,h:d-b}}

  const m=40;cam.s=Math.min(200,Math.max(8,Math.min((r.width-2*m)/Math.max(b.w,1),(r.height-2*m)/Math.max(b.h,1))));

// ---------- Ajustes (snap) ----------
const rej=v=>Math.round(v/.05)*.05;
function puntosClave(pl,excl){const pts=[];
  for(const w of pl.paredes.concat(pl.cables)){if(excl&&excl.has(w))continue;pts.push({x:w.x1,y:w.y1},{x:w.x2,y:w.y2})}
  return pts}
function ajustarPunto(p,origen,tipo,excl){
  const pl=PL(),rad=16/cam.s;let best=null,bd=rad;
  const pts=puntosClave(pl,excl);
  if(tipo==="cable")for(const it of pl.items)if(!NO_CUENTA[it.t])pts.push({x:it.x,y:it.y});
  for(const q of pts){const d=Math.hypot(q.x-p.x,q.y-p.y);if(d<bd){bd=d;best=q}}
  if(!best&&tipo!=="cable"){ // pegar a cualquier punto de una pared
    for(const w of pl.paredes){if(excl&&excl.has(w))continue;const q=proyeccion(p,w);if(q.d<rad*.7&&q.d<bd){bd=q.d;best={x:q.x,y:q.y}}}}
  if(best)return{x:best.x,y:best.y,snap:best};
  let x=rej(p.x),y=rej(p.y);
  if(origen){const dx=x-origen.x,dy=y-origen.y;if(Math.abs(dy)<Math.abs(dx)*.13)y=origen.y;else if(Math.abs(dx)<Math.abs(dy)*.13)x=origen.x;}

function svgExport(pl,fd){
  const p=P(),b=limites(pl)||{x:0,y:0,w:4,h:3},n=cuentas(pl);
  const ks=Object.keys(T).filter(k=>n[k]);const usados=new Set(pl.cables.map(c=>c.c));const circs=CIRC.filter(c=>usados.has(c.id));
  const m=.8,W=Math.max(b.w+2*m,9),cab=1.3,filas=Math.ceil((ks.length+circs.length)/3),ley=filas?.7+filas*.45:.2,H=cab+b.h+2*m+ley;
  const ox=(W-b.w)/2-b.x,oy=cab+m-b.y;
  const T2=(x,y,s,t,c,w,an)=>`<text x="${x}" y="${y}" font-size="${s}" fill="${c}" font-weight="${w||700}" text-anchor="${an||"start"}" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif">${esc(t)}</text>`;
  let s=`<svg xmlns="${NS}" viewBox="0 0 ${r2(W)} ${r2(H)}" width="${r2(W)*100}" height="${r2(H)*100}"><rect width="${W}" height="${H}" fill="#fff"/>`;
  s+=`<rect width="${W}" height="${cab}" fill="${C.azul}"/>`+T2(.4,.45,.38,EMP.marca||"","#fff",800)+T2(.4,.92,.17,[EMP.telefono,EMP.email].filter(Boolean).join(" · "),"#B8C7DA",500);
  s+=T2(W-.4,.45,.26,p.nombre+" · "+pl.nombre,"#fff",700,"end")+T2(W-.4,.92,.17,[p.cliente,new Date().toLocaleDateString("es-ES")].filter(Boolean).join(" · "),"#B8C7DA",500,"end");
  s+=`<g transform="translate(${ox} ${oy})">${escena(pl,{cotas:true,fondo:fd||(fd===undefined&&pl.fondo?IMG[pl.fondo.img]:null)})}</g>`;
  if(filas){const y0=cab+b.h+2*m;s+=`<line x1=".4" y1="${y0}" x2="${W-.4}" y2="${y0}" stroke="#DCE3EC" stroke-width=".02"/>`+T2(.4,y0+.3,.17,"LEYENDA Y CANTIDADES",C.gris,700);
    const cw=(W-.8)/3;let i=0;
    for(const k of ks){const x=.4+(i%3)*cw,y=y0+.75+Math.floor(i/3)*.45;s+=`<g transform="translate(${x+.25} ${y}) scale(.8)">${simb({t:k,x:0,y:0,r:0,w:T[k].w?.6:undefined})}</g>`+T2(x+.65,y,.16,`${T[k].n} × ${n[k]}`,C.azul,600);i++}
    for(const c of circs){const x=.4+(i%3)*cw,y=y0+.75+Math.floor(i/3)*.45;const ml=pl.cables.filter(z=>z.c===c.id).reduce((a,z)=>a+Math.hypot(z.x2-z.x1,z.y2-z.y1),0);
      s+=`<line x1="${x}" y1="${y}" x2="${x+.5}" y2="${y}" stroke="${c.c}" stroke-width=".04" stroke-dasharray=".12 .07"/>`+T2(x+.65,y,.16,`${c.n} · ${fmt(ml,1)} m`,C.azul,600);i++}}
  return s+"</svg>"}
async function aPng(pl){const fd=pl.fondo?await dataDeImg(pl.fondo.img).catch(()=>null):null;const s=svgExport(pl,fd);const m=s.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);const W=+m[1],H=+m[2];
  const k=Math.min(160,Math.max(90,2400/W)),cw=Math.round(W*k),ch=Math.round(H*k);
  const img=new Image();const url=URL.createObjectURL(new Blob([s],{type:"image/svg+xml"}));
  await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cw,ch);cx.drawImage(img,0,0,cw,ch);URL.revokeObjectURL(url);
  return await new Promise(ok=>cv.toBlob(ok,"image/png"))}

async function compartir(files){
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}catch(e){if(e.name==="AbortError")return}
  for(const f of files){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}}

function calcular(pr){const part=pr.tipo!=="empresa";let base=0,tci=0;const filas=[];
  for(const x of pr.partidas){const q=+x.q||0;let bu,fijo=null;
    if(x.iva!==undefined&&x.iva!==null){fijo=+x.iva;bu=fijo/(1+IVA)}else bu=+x.p||0;
    bu=r2(bu);const bl=r2(bu*q);let cu,cl;if(fijo!==null){cu=r2(fijo);cl=r2(fijo*q)}else{cu=r2(bu*(1+IVA));cl=r2(bl*(1+IVA))}
    base+=bl;tci+=cl;filas.push({x,c:x.c,d:x.d,q,unit:part?cu:bu,imp:part?cl:bl})}
  base=r2(base);let cuota,total;if(part){total=r2(tci);cuota=r2(total-base)}else{cuota=r2(base*IVA);total=r2(base+cuota)}
  return{filas,base,cuota,total,part}}

  add(T_?"e_enchT":"e_ench",ptsEnch);add(T_?"e_luzT":"e_luz",senc);add(T_?"e_conmT":"e_conm",conm);add("e_cruz",cruces);add("e_lamp",lamp);
  if(op.empotrado)add("e_emp",ptsEnch+senc+conm+cruces);
  const LIN={horno:["HORNO","m_c6","m_t25"],vitro:["VITRO","m_c6","m_t25"],lavadora:["LAVADORA","m_c4","m_t20"],lavavaj:["LAVAVAJILLAS","m_c4","m_t20"],secadora:["SECADORA","m_c4","m_t20"],
    termo:["TERMO","m_c4","m_t20"],aa:["AIRE ACONDICIONADO","m_c25","m_t20"],t25:["TOMA 25 A","m_c6","m_t25"],tri:["TOMA TRIFÁSICA","m_c6","m_t25"],frigo:["FRIGORÍFICO","m_c25","m_t20"],bomba:["BOMBA","m_c4","m_t20"],split:["AIRE ACONDICIONADO","m_c25","m_t20"],ve:["CARGADOR VE","m_c6","m_t25"],linea:["OTRA","m_c25","m_t20"],subida:["SUBIDA A PLANTA","m_c25","m_t20"]};

function firmaPad(){const cv=$("firmaCv"),cx=cv.getContext("2d");let dib=false,ult=null,cambiada=false;
  const limpiar=()=>{cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle="#E3E8EF";cx.lineWidth=2;cx.beginPath();cx.moveTo(30,170);cx.lineTo(570,170);cx.stroke()};

  const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);dib=true;ult=pos(e);if(!cambiada&&EMP.firma){limpiar()}cambiada=true};
  cv.onpointermove=e=>{if(!dib)return;const p=pos(e);cx.strokeStyle="#0B1F3A";cx.lineWidth=4;cx.lineCap="round";cx.beginPath();cx.moveTo(ult.x,ult.y);cx.lineTo(p.x,p.y);cx.stroke();ult=p};

  $("fFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const i=new Image();i.onload=()=>{

    EMP.firma=c2.toDataURL("image/png");guardarEmp();cambiada=false;firmaPad()};i.src=rd.result};rd.readAsDataURL(f)}}
function recortar(cv){const cx=cv.getContext("2d"),d=cx.getImageData(0,0,cv.width,cv.height).data;let a=cv.width,b=cv.height,c=0,e=0;

// Pone en el presupuesto lo que devuelve la IA. Lo de la tarifa va con tu precio; lo demás, marcado para revisar.
function aplicarIA(pr,r){let n=0;
  for(const p of r.partidas||[]){const q=+p.cantidad>0?+p.cantidad:1;
    if(p.tarifa_id&&tar(p.tarifa_id)){agregar(pr,tar(p.tarifa_id),q);n++;continue}
    if(!p.concepto)continue;pr.partidas.push({id:uid(),c:p.concepto,d:p.descripcion||"",q,p:+p.precio||0,revisar:true});n++}
  if(r.titulo&&!pr.titulo)pr.titulo=r.titulo;
  for(const t of r.notas||[])if(t&&!pr.notas.includes(t))pr.notas.push(t);
  return n}
$("iaOk").onclick=async()=>{const texto=$("iaTxt").value.trim();if(!texto&&!iaFotos.length){$("iaEstado").textContent="Cuenta el trabajo o añade una foto.";return}
  if(iaRec)iaRec.stop();
  if(!navigator.onLine){$("iaEstado").textContent="Necesitas conexión para usar la IA.";return}
  $("iaOk").disabled=true;$("iaEstado").textContent="Preparando el presupuesto… (unos 20 segundos)";
  try{const r=await Nube.funcion("ia",{texto,fotos:iaFotos,tarifa:tarifaParaIA(),tipo:prCur?prCur.tipo:"particular"},90000);
    if(!(r.partidas||[]).length){$("iaEstado").textContent="";$("iaOk").disabled=false;await avisar("No he sacado partidas de eso."+((r.dudas||[]).length?"\n\n"+r.dudas.join("\n"):" Prueba a contarlo con más detalle."));return}
    const pr=prCur||nuevoPres();const n=aplicarIA(pr,r);prCur=pr;guardarPres();$("vIA").classList.remove("on");
    if(modo!=="pres")setModo("pres");else editorPres();
    const rev=pr.partidas.filter(x=>x.revisar).length;
    await avisar(`Listo: ${n} partida${n===1?"":"s"}.`+(rev?` ${rev} con precio orientativo (en naranja): revísalo.`:"")+((r.dudas||[]).length?"\n\nConfirma antes de enviarlo:\n• "+r.dudas.join("\n• "):""))}
  catch(e){$("iaOk").disabled=false;
    $("iaEstado").textContent=e.codigo==="inactiva"?"Tu prueba ha terminado. Suscríbete desde Inicio → Cuenta y suscripción.":/abort/i.test(e.name+e.message)?"La IA ha tardado demasiado. Inténtalo de nuevo.":"No se ha podido: "+e.message}};
cargarPres();
function ponerCliente(pr,c){pr.clienteId=c.id;pr.tipo=c.tipo==="empresa"?"empresa":"particular";
  pr.cliente={nombre:c.nombre||"",nif:c.nif||"",direccion:[c.dir,c.localidad].filter(Boolean).join(", "),contacto:c.contacto||"",telefono:c.tel||"",email:c.email||""};guardarPres()}
function elegirCliente(){const L=Nube.clientes();const pinta=q=>{q=(q||"").toLowerCase();const f=L.filter(c=>!q||[c.nombre,c.localidad,c.tel].join(" ").toLowerCase().includes(q));
    $("cliLista").innerHTML=f.length?f.map(c=>`<div class="fila tarjeta" data-cid="${c.id}"><div class="q"><b>${esc(c.nombre)}</b><small>${esc([c.localidad,c.tel].filter(Boolean).join(" · ")||"—")}</small></div></div>`).join(""):`<p class="vacio">${L.length?"Ningún cliente coincide.":"Todavía no hay clientes. Créalos en la app de Clientes."}</p>`};
  $("cliBus").value="";pinta("");$("cliBus").oninput=e=>pinta(e.target.value);$("vCli").classList.add("on");
  $("cliLista").onclick=e=>{const r=e.target.closest("[data-cid]");if(!r)return;ponerCliente(prCur,L.find(c=>c.id===r.dataset.cid));$("vCli").classList.remove("on");editorPres()}}

// ---------- Inicio ----------
window.addEventListener("resize",()=>dibujar());
cargar();botonesHist();ajustar();panel();
if(!PL().paredes.length&&!PL().items.length)setHerr("hab");
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
// Enlaces desde el inicio y desde las fichas de clientes
(async()=>{const QP=new URLSearchParams(location.search);if(!location.search)return;history.replaceState(null,"",location.pathname);
  const cid=QP.get("cliente"),cli=cid?Nube.clientes().find(c=>c.id===cid):null,n=QP.get("nuevo");
  if(QP.get("abrir")&&db.proy.some(p=>p.id===QP.get("abrir"))){db.cur=QP.get("abrir");guardar();ajustar()}
  if(QP.get("pres")){const p=PR.lista.find(x=>x.id===QP.get("pres"));if(p){prCur=p;setModo("pres")}}
  if(QP.get("modo")==="pres")setModo("pres");
  if(n==="pres"){prCur=nuevoPres();if(cli)ponerCliente(prCur,cli);setModo("pres")}
  if(n==="ia"){prCur=null;if(cli){prCur=nuevoPres();ponerCliente(prCur,cli)}setModo("pres");abrirIA()}
  if(n==="plano"){const nom=cli?cli.nombre:await pedir("Nombre del plano (p. ej. Casa Irina, Nave polígono)","");if(!nom)return;
    const p=nuevoProyecto(nom.trim(),cli?[cli.dir,cli.localidad].filter(Boolean).join(", "):"");if(cli)p.clienteId=cli.id;
    db.proy.unshift(p);db.cur=p.id;hist=[];rehacer=[];botonesHist();sel=null;guardar();setHerr("hab");ajustar()}})();
// Sincronización con la nube
function recargarTodo(){cargar();cargarPres();hist=[];rehacer=[];botonesHist();fondoKey="";
  if(modo==="pres"){prCur=prCur&&PR.lista.find(p=>p.id===prCur.id)||null;prCur?editorPres():listaPres()}else{sel=null;dibujar();ajustar();panel()}}
Nube.sincronizar(["planos","presupuestos","empresa"]).then(ch=>{if(ch.length){recargarTodo();aviso("Datos actualizados desde la nube",2000)}refrescarEnlaces()});
Nube.reintentarFotos(id=>IDB.get(id));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")Nube.sincronizar(["planos","presupuestos","empresa"]).then(ch=>{if(ch.length)recargarTodo()})});
</script>
