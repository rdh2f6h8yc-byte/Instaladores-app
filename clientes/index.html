<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clientes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<title>Clientes</title>
<style>
:root{--azul:#0B1F3A;--acento:#1E88E5;--gris:#5F6B7A;--claro:#EEF2F7;--fondo:#F3F6FA;--borde:#D6DEE8;--rojo:#C62828;--verde:#2E9D5B;--nar:#E8730C;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--azul)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:calc(var(--st) + 8px) 10px 8px;display:flex;align-items:center;gap:6px}
header .tit{flex:1;min-width:0}
header small{display:block;font-size:11px;letter-spacing:.08em;opacity:.7}
header b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none}
.ib:active{background:rgba(255,255,255,.15)}
main{padding:12px 12px calc(var(--sb) + 90px);max-width:680px;margin:0 auto}
.buscar{display:block;width:100%;padding:12px 14px;border:1px solid var(--borde);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--azul)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:16px;background:#fff;border:1px solid var(--borde);font-size:13px;font-weight:600}
.chips button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:18px 0 7px;display:flex;align-items:center}
h3 .mas{margin-left:auto;color:var(--acento);font-size:13px;letter-spacing:0;text-transform:none;font-weight:700}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.cli{display:flex;align-items:center;gap:11px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:15px}
.cli .q{flex:1;min-width:0}.cli .q b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .q small{display:block;color:var(--gris);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:9px;background:var(--claro);color:var(--gris);margin:3px 4px 0 0}
.tag.v{background:#E3F4EA;color:var(--verde)}.tag.r{background:#FDECEC;color:var(--rojo)}.tag.n{background:#FFF1E3;color:var(--nar)}.tag.a{background:#E3F0FC;color:var(--acento)}
.alerta{background:#FFF8EC;border:1px solid #F5D9AE;border-radius:12px;padding:10px 12px;margin-top:12px}
.alerta b{font-size:13px}.alerta .it{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #F5E3C6;font-size:13.5px;cursor:pointer}
.alerta .it:first-of-type{border-top:0}
.vacio{text-align:center;color:var(--gris);padding:28px 10px;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(var(--sb) + 18px);background:var(--azul);color:#fff;border-radius:28px;padding:15px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(11,31,58,.3);z-index:6}
.acciones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.acciones a,.acciones button{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.acciones span{font-size:20px}
.acciones .off{opacity:.35;pointer-events:none}
.dato{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--claro);font-size:14px}
.dato:first-child{border-top:0}.dato span{color:var(--gris);width:92px;flex:none;font-size:12.5px;padding-top:1px}
.dato div{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.trab{cursor:pointer}.trab .top{display:flex;justify-content:space-between;gap:8px}
.trab small{color:var(--gris);font-size:12.5px}
.mat{display:grid;grid-template-columns:64px 1fr 36px;gap:6px;margin-bottom:6px}.mat input{margin:0!important}.mat button{background:var(--claro);border-radius:9px;font-weight:700;color:var(--gris)}
.fotos{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.fotos img{width:74px;height:74px;object-fit:cover;border-radius:8px;flex:none;background:var(--claro)}
.clave{font-family:ui-monospace,Menlo,monospace;letter-spacing:.03em}
.mini{font-size:12px;font-weight:700;color:var(--acento);padding:2px 6px}
label{display:block;font-size:12px;color:var(--gris);font-weight:600;margin:8px 0}
input:not([type=checkbox]):not([type=file]),textarea,select{display:block;width:100%;margin-top:3px;padding:10px;border:1px solid var(--borde);border-radius:10px;font:inherit;font-size:16px;color:var(--azul);background:#fff}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.seg button{border:1px solid var(--borde);border-radius:10px;padding:9px;font-weight:700;background:#fff}
.seg button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--azul);margin:10px 0}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--claro);font-weight:700;margin-top:8px;font-size:15px;text-align:center}
.btn.az{background:var(--azul);color:#fff}.btn.rojo{background:#FDECEC;color:var(--rojo)}
.btn small{display:block;font-weight:500;opacity:.75;font-size:12px}
.fila2{display:flex;gap:8px}.fila2 .btn{flex:1}
.velo{position:fixed;inset:0;background:rgba(11,31,58,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.velo.on{display:flex}
.hoja{background:#fff;width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(var(--sb) + 18px)}
.hoja h2{margin:2px 0 8px;font-size:18px;display:flex;align-items:center}
.hoja h2 .x{margin-left:auto;font-size:22px;width:36px;height:36px}
#vDlg{align-items:center;padding:16px;z-index:20}#vDlg .hoja{border-radius:16px;max-width:420px}
#visor{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center}
#visor.on{display:flex}#visor img{max-width:100%;max-height:100%}
#visor .barra{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:12px 12px calc(var(--sb) + 12px)}
#visor .barra button{flex:1;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:12px;font-weight:700}
#aviso{position:fixed;left:50%;bottom:calc(var(--sb) + 86px);transform:translateX(-50%);background:rgba(11,31,58,.92);color:#fff;font-size:13px;padding:8px 14px;border-radius:14px;z-index:40;display:none;max-width:90%}
</style>
</head>
<body>
<header>
  <button class="ib" id="bAtras">⌂</button>
  <div class="tit"><small>CLIENTES <span id="nubeEst" style="color:#8FA3BC">☁︎</span></small><b id="titulo">Clientes</b></div>
  <button class="ib" id="bMenu">⋯</button>
</header>
<main id="main"></main>
<button class="fab" id="fab">＋ Cliente</button>
<div id="aviso"></div>

<div class="velo" id="vForm"><div class="hoja"><h2 id="fTit">Cliente <button class="x" data-cerrar>×</button></h2><div id="fCuerpo"></div></div></div>
<div class="velo" id="vMenu"><div class="hoja"><h2>Opciones <button class="x" data-cerrar>×</button></h2>
  <button class="btn" id="mJson">Guardar copia de seguridad (.json)<small>Clientes, trabajos, accesos y fotos</small></button>
  <button class="btn" id="mImp">Restaurar copia (.json)</button>
  <button class="btn" id="mCsv">Exportar lista de clientes (Excel / CSV)</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
  <p style="font-size:12px;color:var(--gris);line-height:1.4;margin-top:14px">Los datos se guardan solo en este móvil. Haz una copia de vez en cuando y guárdala en iCloud o Google Drive.</p>
</div></div>
<div class="velo" id="vDlg"><div class="hoja">
  <div id="dMsg" style="font-weight:700;font-size:16px;margin-bottom:12px;white-space:pre-wrap"></div>
  <input id="dIn" autocomplete="off">
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="dNo" style="width:auto;padding:10px 16px;margin:0">Cancelar</button><button class="btn az" id="dOk" style="width:auto;padding:10px 16px;margin:0">Aceptar</button></div>
</div></div>
<div class="velo" id="vFirma" style="align-items:stretch;z-index:25"><div class="hoja" style="max-height:none;height:100%;border-radius:0;display:flex;flex-direction:column;padding-top:calc(var(--st) + 14px)">
  <h2 style="margin-bottom:4px">Firma del cliente</h2><p style="margin:0 0 8px;color:var(--gris);font-size:13px">Firma con el dedo dentro del recuadro. Gira el móvil si necesitas más espacio.</p>
  <canvas id="firmaCv" style="flex:1;width:100%;min-height:180px;border:2px dashed var(--borde);border-radius:12px;touch-action:none;background:#fff"></canvas>
  <div class="g2"><label>Nombre de quien firma<input id="fNom"></label><label>DNI (opcional)<input id="fDni"></label></div>
  <div class="fila2"><button class="btn" id="fBorrar">Borrar</button><button class="btn" id="fCancelar">Cancelar</button><button class="btn az" id="fAceptar">Aceptar</button></div></div></div>
<div id="visor"><img id="visorImg" alt=""><div class="barra"><button id="visorBorrar">Eliminar foto</button><button id="visorCerrar">Cerrar</button></div></div>

<script src="/config.js"></script>
<script src="/nube.js"></script>
<script src="/pdf.js"></script>
<script>
"use strict";
if(!Nube.requerir())throw new Error("Hay que iniciar sesión");
const LS="almara-clientes-v1";
const CATS=["Starlink","WiFi","Redes / rack","Videovigilancia","Electricidad","ICT","Otro"];
const CLASES=["Instalación","Revisión","Avería","Visita","Presupuesto"];
const COL=["#1E88E5","#2E9D5B","#E8730C","#7B3FA0","#00838F","#C62828","#0B1F3A","#C99A00"];
let volverA="lista", db={clientes:[]}, vista="lista", cur=null, filtro="todos", busq="";
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hoy=()=>new Date().toISOString().slice(0,10);
const fES=f=>{if(!f)return"";const[a,m,d]=f.split("-");return`${d}/${m}/${a}`};
const dias=f=>Math.round((new Date(f+"T12:00:00")-new Date(hoy()+"T12:00:00"))/864e5);
const masMeses=(f,n)=>{const d=new Date(f+"T12:00:00");d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const eur=v=>(Math.round((+v||0)*100)/100).toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".")+" €";
const iniciales=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const color=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return COL[h%COL.length]};
const telLimpio=t=>String(t||"").replace(/[^\d+]/g,"");
const waNum=t=>{let n=telLimpio(t).replace(/^\+/,"");if(n.length===9)n="34"+n;return n};
function cargar(){try{const s=localStorage.getItem(LS);if(s)db=JSON.parse(s)}catch(e){}if(!db.clientes)db.clientes=[]}
function guardar(){try{localStorage.setItem(LS,JSON.stringify(db));Nube.marcar("clientes")}catch(e){aviso("No se ha podido guardar",3000)}}
function aviso(t,ms){const a=$("aviso");if(!t){a.style.display="none";return}a.textContent=t;a.style.display="block";clearTimeout(aviso.t);aviso.t=setTimeout(()=>a.style.display="none",ms||1800)}
// Diálogos propios
function dialogo(msg,valor,inp,canc){return new Promise(ok=>{const v=$("vDlg"),i=$("dIn");$("dMsg").textContent=msg;i.style.display=inp?"block":"none";i.value=valor||"";$("dNo").style.display=canc?"":"none";v.classList.add("on");
  if(inp)setTimeout(()=>i.focus(),60);const fin=r=>{v.classList.remove("on");ok(r)};$("dOk").onclick=()=>fin(inp?i.value:true);$("dNo").onclick=()=>fin(inp?null:false);i.onkeydown=e=>{if(e.key==="Enter")fin(i.value)}})}
const confirmar=m=>dialogo(m,"",false,true), avisar=m=>dialogo(m,"",false,false);
// Fotos en IndexedDB
const IDB={p:null,abrir(){return this.p||(this.p=new Promise((ok,ko)=>{try{const r=indexedDB.open("almara-clientes",1);r.onupgradeneeded=()=>r.result.createObjectStore("fotos");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}catch(e){ko(e)}}))},
  async op(m,fn){const d=await this.abrir();return new Promise((ok,ko)=>{const t=d.transaction("fotos",m),r=fn(t.objectStore("fotos"));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ko(t.error)})},
  get(k){return this.op("readonly",s=>s.get(k))},set(k,v){return this.op("readwrite",s=>s.put(v,k))},del(k){return this.op("readwrite",s=>s.delete(k))}};
const URLS={};
async function urlFoto(id){if(URLS[id])return URLS[id];try{let b=await IDB.get(id).catch(()=>null);if(!b){b=await Nube.bajarFoto(id);if(b)await IDB.set(id,b).catch(()=>{})}if(b)return URLS[id]=URL.createObjectURL(b)}catch(e){}return""}
async function pintarFotos(){for(const im of document.querySelectorAll("img[data-foto]")){if(!im.src||im.src===location.href)im.src=await urlFoto(im.dataset.foto)}}
async function comprimir(file){const u=URL.createObjectURL(file),im=new Image();await new Promise((ok,ko)=>{im.onload=ok;im.onerror=ko;im.src=u});
  const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);
  cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);return new Promise(ok=>cv.toBlob(ok,"image/jpeg",.8))}

// ---------- Avisos de mantenimiento ----------
function pendientes(){const out=[];
  for(const c of db.clientes){const m=c.mant;if(!m||!m.activo)continue;
    if(m.proxima){const d=dias(m.proxima);if(d<=30)out.push({c,d,t:"Revisión",f:m.proxima})}
    if(m.fin){const d=dias(m.fin);if(d<=30)out.push({c,d,t:"Renovar contrato",f:m.fin})}}
  return out.sort((a,b)=>a.d-b.d)}
const cuando=d=>d<0?`hace ${-d} día${d===-1?"":"s"}`:d===0?"hoy":d===1?"mañana":`en ${d} días`;

// ---------- Vistas ----------
function ir(v,c){vista=v;cur=c||null;pintar();window.scrollTo(0,0)}
function pintar(){const top=vista==="lista"||vista==="partes";$("bAtras").textContent=top?"⌂":"‹";$("fab").style.display=vista==="lista"?"":"none";
  if(vista==="lista")pintarLista();else if(vista==="partes")pintarPartes();else pintarFicha()}
function pintarLista(){$("titulo").textContent="Clientes";
  const q=busq.toLowerCase();let L=db.clientes.filter(c=>{
    if(filtro==="empresa"&&c.tipo!=="empresa")return false;if(filtro==="particular"&&c.tipo==="empresa")return false;
    if(filtro==="mant"&&!(c.mant&&c.mant.activo))return false;if(CATS.includes(filtro)&&!(c.trabajos||[]).some(t=>t.cat===filtro))return false;
    if(q){const txt=[c.nombre,c.contacto,c.tel,c.email,c.dir,c.localidad,c.nif,c.notas,...(c.trabajos||[]).map(t=>t.desc+" "+t.equipos+" "+t.presupuesto)].join(" ").toLowerCase();if(!txt.includes(q))return false}
    return true}).sort((a,b)=>(b.act||"").localeCompare(a.act||""));
  const pen=pendientes();let h=`<input class="buscar" id="busq" placeholder="Buscar nombre, teléfono, pueblo, equipo…" value="${esc(busq)}" type="search">
  <div class="chips">${[["todos","Todos"],["empresa","Empresas"],["particular","Particulares"],["mant","Con mantenimiento"],...CATS.slice(0,6).map(c=>[c,c]),["partes","📝 Partes de trabajo"]].map(([k,l])=>`<button data-fil="${esc(k)}" class="${filtro===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(pen.length&&!q&&filtro==="todos")h+=`<div class="alerta"><b>🔔 Mantenimientos próximos</b>${pen.map(p=>`<div class="it" data-cli="${p.c.id}"><span>${esc(p.c.nombre)} · ${p.t}</span><span style="color:${p.d<0?"var(--rojo)":"var(--nar)"};font-weight:700;white-space:nowrap">${cuando(p.d)}</span></div>`).join("")}</div>`;
  h+=`<h3>${L.length} cliente${L.length===1?"":"s"}</h3>`;
  if(!db.clientes.length)h+=`<div class="vacio">Todavía no hay clientes.<br>Pulsa <b>＋ Cliente</b> para crear la primera ficha.</div>`;
  else if(!L.length)h+=`<div class="vacio">Ningún cliente coincide.</div>`;
  for(const c of L){const cats=[...new Set((c.trabajos||[]).map(t=>t.cat))];
    h+=`<div class="card cli" data-cli="${c.id}"><div class="av" style="background:${color(c.nombre)}">${esc(iniciales(c.nombre))}</div><div class="q"><b>${esc(c.nombre)}</b>
    <small>${esc([c.localidad,c.tel].filter(Boolean).join(" · ")||"Sin datos de contacto")}</small>
    <div>${c.tipo==="empresa"?`<span class="tag a">Empresa</span>`:""}${c.mant&&c.mant.activo?`<span class="tag v">Mantenimiento</span>`:""}${cats.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div></div></div>`}
  $("main").innerHTML=h;
  $("busq").oninput=e=>{busq=e.target.value;const p=e.target.selectionStart;pintarLista();const b=$("busq");b.focus();b.setSelectionRange(p,p)}}
function pintarFicha(){const c=cur;$("titulo").textContent=c.nombre;const m=c.mant||{};
  const mapa=[c.dir,c.localidad].filter(Boolean).join(", ");
  let h=`<div class="card cli" style="cursor:default"><div class="av" style="background:${color(c.nombre)};width:52px;height:52px;font-size:18px">${esc(iniciales(c.nombre))}</div><div class="q"><b style="font-size:18px;white-space:normal">${esc(c.nombre)}</b>
    <small>${c.tipo==="empresa"?"Empresa":"Particular"}${c.contacto?" · Att. "+esc(c.contacto):""}</small></div><button class="mini" data-a="editar">Editar</button></div>
  <div class="acciones">
    <a class="${c.tel?"":"off"}" href="tel:${esc(telLimpio(c.tel))}"><span>📞</span>Llamar</a>
    <a class="${c.tel?"":"off"}" href="https://wa.me/${esc(waNum(c.tel))}" target="_blank" rel="noopener"><span>💬</span>WhatsApp</a>
    <a class="${c.email?"":"off"}" href="mailto:${esc(c.email)}"><span>✉️</span>Email</a>
    <a class="${mapa?"":"off"}" href="https://maps.google.com/?q=${encodeURIComponent(mapa)}" target="_blank" rel="noopener"><span>📍</span>Mapa</a></div>
  <div class="card">${[["Teléfono",c.tel],["Email",c.email],["Dirección",mapa],["NIF / CIF",c.nif],["Notas",c.notas]].filter(x=>x[1]).map(([k,v])=>`<div class="dato"><span>${k}</span><div>${esc(v)}</div></div>`).join("")||`<div class="dato"><div style="color:var(--gris)">Sin datos. Pulsa Editar para completarlos.</div></div>`}</div>`;
  // Mantenimiento
  h+=`<h3>Mantenimiento <button class="mas" data-a="mant">${m.activo?"Editar":"＋ Añadir"}</button></h3>`;
  if(m.activo){const dp=m.proxima?dias(m.proxima):null;
    h+=`<div class="card">${[["Plan",m.plan],["Cuota",m.cuota?eur(m.cuota)+" / mes + IVA":""],["Desde",fES(m.inicio)],["Hasta",fES(m.fin)]].filter(x=>x[1]).map(([k,v])=>`<div class="dato"><span>${k}</span><div>${esc(v)}</div></div>`).join("")}

      await compartir(new File([b],("Parte_"+t.numero+"_"+cur.nombre).replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g,"_")+".pdf",{type:"application/pdf"}))}catch(err){aviso("");await avisar("No se ha podido crear el PDF")}
    cerrarForm();pintar()};
  if(!n)$("tDel").onclick=async()=>{if(!await confirmar("¿Eliminar este parte y sus fotos?"))return;descontarMaterial(t.material,[],"Parte eliminado "+(t.numero||""));for(const f of t.fotos||[]){IDB.del(f).catch(()=>{});Nube.borrarFoto(f)}cur.trabajos=cur.trabajos.filter(x=>x!==t);tocar(cur);cerrarForm();pintar()}}
// Material de la furgoneta: lo apuntado en el parte se descuenta del stock (y se devuelve si se quita)
function materialFurgo(){try{const m=JSON.parse(localStorage.getItem("almara-material-v1"));if(m&&m.items)return{movs:[],inventarios:[],...m}}catch(e){}return{items:[],movs:[],inventarios:[]}}
function descontarMaterial(antes,despues,ref){const M=materialFurgo();if(!M.items.length)return;const n=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:0};
  const buscar=c=>M.items.find(i=>i.nombre.trim().toLowerCase()===String(c||"").trim().toLowerCase());const d={};
  for(const l of antes||[]){const it=buscar(l.c);if(it)d[it.id]=(d[it.id]||0)+n(l.q)}for(const l of despues||[]){const it=buscar(l.c);if(it)d[it.id]=(d[it.id]||0)-n(l.q)}
  let ch=0;for(const id in d){const q=Math.round(d[id]*100)/100;if(!q)continue;const it=M.items.find(i=>i.id===id);it.stock=Math.round((it.stock+q)*100)/100;
    M.movs.unshift({id:uid(),fecha:new Date().toISOString(),itemId:id,q,tipo:"parte",ref});ch++;if(it.min>0&&it.stock<=it.min)aviso("⚠️ Queda poco: "+it.nombre,3000)}
  if(ch){M.movs=M.movs.slice(0,1000);localStorage.setItem("almara-material-v1",JSON.stringify(M));Nube.marcar("material")}}
// Firma del cliente con el dedo
function abrirFirma(listo){const v=$("vFirma"),cv=$("firmaCv"),cx=cv.getContext("2d");v.classList.add("on");
  const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*2);cv.height=Math.round(r.height*2);
  const limpiar=()=>{cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle="#D6DEE8";cx.lineWidth=3;cx.beginPath();cx.moveTo(40,cv.height*.78);cx.lineTo(cv.width-40,cv.height*.78);cx.stroke()};
  limpiar();let dib=false,ult=null,trazo=false;$("fNom").value=(cur&&(cur.contacto||cur.nombre))||"";$("fDni").value="";
  const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*cv.width/b.width,y:(e.clientY-b.top)*cv.height/b.height}};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);dib=true;ult=pos(e);trazo=true};
  cv.onpointermove=e=>{if(!dib)return;const p=pos(e);cx.strokeStyle="#0B1F3A";cx.lineWidth=5;cx.lineCap="round";cx.beginPath();cx.moveTo(ult.x,ult.y);cx.lineTo(p.x,p.y);cx.stroke();ult=p};
  cv.onpointerup=cv.onpointercancel=()=>{dib=false};
  $("fBorrar").onclick=()=>{limpiar();trazo=false};$("fCancelar").onclick=()=>v.classList.remove("on");
  $("fAceptar").onclick=()=>{if(!trazo){aviso("Firma en el recuadro");return}const png=recorte(cv);v.classList.remove("on");
    listo({png,nombre:$("fNom").value.trim(),dni:$("fDni").value.trim(),fecha:new Date().toISOString()})}}
function recorte(cv){const cx=cv.getContext("2d"),d=cx.getImageData(0,0,cv.width,cv.height).data;let a=cv.width,b=cv.height,c=0,e=0;
  for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2){const i=(y*cv.width+x)*4;if(d[i]<120&&d[i+2]<160){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);e=Math.max(e,y)}}
  const m=10,w=Math.max(10,c-a+2*m),h=Math.max(10,e-b+2*m),k=Math.min(1,500/w),o=document.createElement("canvas");o.width=Math.round(w*k);o.height=Math.round(h*k);
  const ox=o.getContext("2d");ox.fillStyle="#fff";ox.fillRect(0,0,o.width,o.height);ox.drawImage(cv,a-m,b-m,w,h,0,0,o.width,o.height);return o.toDataURL("image/png")}

  seccion("TRABAJO REALIZADO",t.desc);seccion("EQUIPOS INSTALADOS",t.equipos);

    <div>${t.estado==="pendiente"?`<span class="tag n">Pendiente</span>`:`<span class="tag v">Terminado</span>`}${t.firmaCli?`<span class="tag a">Firmado</span>`:`<span class="tag">Sin firmar</span>`}${(t.fotos||[]).length?`<span class="tag">📷 ${t.fotos.length}</span>`:""}</div></div>`;

async function compartir(file){try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function calendario(c){const m=c.mant,d=m.proxima.replace(/-/g,""),fin=masMeses(m.proxima,0).replace(/-/g,"");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Instaladores//Clientes//ES","BEGIN:VEVENT","UID:"+uid()+"@"+location.hostname,"DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART;VALUE=DATE:"+d,"SUMMARY:Revisión mantenimiento · "+c.nombre,"DESCRIPTION:"+[c.tel,c.dir,c.localidad].filter(Boolean).join(" · "),"LOCATION:"+[c.dir,c.localidad].filter(Boolean).join(", "),
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Revisión mañana","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  compartir(new File([ics],"Revision_"+c.nombre.replace(/[^\wÀ-ÿ]+/g,"_")+".ics",{type:"text/calendar"}))}
